<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fahrtenbuch">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/npm/twemoji@14/svg/1f697.svg">
<title>Fahrtenbuch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f1ed;--surface:#fff;--surface2:#f0ede8;--border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);--text:#1a1a18;--text2:#5f5e5a;--text3:#99988f;--accent:#185fa5;--green:#0f6e56;--green-bg:#e1f5ee;--blue:#185fa5;--blue-bg:#e6f1fb;--amber:#7a4a08;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--surface:#272521;--surface2:#322f2b;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);--text:#edeae4;--text2:#b0ada6;--text3:#7a7870;--green:#5dcaa5;--green-bg:#04342c;--blue:#85b7eb;--blue-bg:#042c53;--amber:#ef9f27;--amber-bg:#412402;--red:#f09595;--red-bg:#501313}}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.header{background:var(--surface);border-bottom:.5px solid var(--border);padding:16px 18px 14px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.header p{font-size:13px;color:var(--text3);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px;background:var(--surface);border-bottom:.5px solid var(--border)}
.stat{background:var(--surface2);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-size:19px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.card{margin:14px;background:var(--surface);border:.5px solid var(--border);border-radius:14px;overflow:hidden}
.card-title{padding:12px 16px 0;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.card-body{padding:12px 16px 16px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
input[type="date"],input[type="number"],select,input[type="text"]{width:100%;background:var(--surface2);border:.5px solid var(--border2);border-radius:9px;padding:10px 12px;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{width:100%;background:var(--surface2);border:.5px dashed var(--border2);border-radius:9px;padding:10px 12px;font-size:16px;color:var(--text3);min-height:42px;display:flex;align-items:center}
.preview.ok{color:var(--green);font-weight:600}
.btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-add{background:var(--accent);color:#fff}
.btn-add:active{opacity:.8;transform:scale(.98)}
.btn-csv{background:var(--green-bg);color:var(--green);border:.5px solid rgba(15,110,86,.25)}
.btn-share{background:var(--blue-bg);color:var(--blue);border:.5px solid rgba(24,95,165,.25)}
.btn-csv:active,.btn-share:active{opacity:.8}
.export-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sec{margin:0 14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.sec-hd span{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.btn-clr{font-size:12px;color:var(--red);background:none;border:.5px solid var(--red);border-radius:7px;padding:4px 11px;cursor:pointer;font-family:inherit;opacity:.65}
.btn-clr:hover{opacity:1}
.tbl-card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
thead{background:var(--surface2)}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:.5px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:.5px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bp{background:var(--green-bg);color:var(--green)}
.ba{background:var(--blue-bg);color:var(--blue)}
.bw{background:var(--amber-bg);color:var(--amber)}
.xbtn{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px}
.xbtn:active{color:var(--red)}
.empty{padding:32px 16px;text-align:center;color:var(--text3);font-size:14px}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <h1>&#x1F697; Fahrtenbuch</h1>
  <p id="hdate"></p>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="sn">0</div><div class="stat-lbl">Fahrten</div></div>
  <div class="stat"><div class="stat-val" id="skm">0</div><div class="stat-lbl">Gesamt km</div></div>
  <div class="stat"><div class="stat-val" id="smo">0</div><div class="stat-lbl">Monat km</div></div>
</div>

<div class="card">
  <div class="card-title">Neue Fahrt eintragen</div>
  <div class="card-body">
    <div class="fg"><label>Datum</label><input type="date" id="d"></div>
    <div class="fg">
      <label>Fahrtart</label>
      <select id="a">
        <option value="">&#x2014; bitte w&#228;hlen &#x2014;</option>
        <option value="privat">Privat</option>
        <option value="arbeit">Arbeit</option>
        <option value="wohnarbeit">Wohn-Arbeit</option>
      </select>
    </div>
    <div class="fg"><label>Zweck / Ziel (optional)</label><input type="text" id="zw" placeholder="z.B. Kunde München"></div>
    <div class="row2">
      <div class="fg"><label>Anfang km</label><input type="number" id="s" placeholder="12340" min="0" inputmode="numeric"></div>
      <div class="fg"><label>Ende km</label><input type="number" id="e" placeholder="12395" min="0" inputmode="numeric"></div>
    </div>
    <div class="fg"><label>Gefahrene km</label><div class="preview" id="prev">wird berechnet &#x2026;</div></div>
    <button class="btn btn-add" onclick="add()">+ Fahrt hinzuf&#252;gen</button>
    <div class="export-row">
      <button class="btn btn-csv" onclick="exportCSV()">&#x1F4C4; CSV Export</button>
      <button class="btn btn-share" onclick="shareCSV()">&#x1F4E4; Teilen / iPhone</button>
    </div>
  </div>
</div>

<div class="sec">
  <div class="sec-hd">
    <span>Alle Eintr&#228;ge</span>
    <button class="btn-clr" onclick="clearAll()">Alle l&#246;schen</button>
  </div>
  <div class="tbl-card">
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>Datum</th><th>Fahrtart</th><th>Zweck</th><th>Anfang km</th><th>Ende km</th><th>Gefahren</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='fbn_v4';
const ld=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}};
const sv=d=>localStorage.setItem(KEY,JSON.stringify(d));
const fd=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};
const fmt=n=>Number(n).toLocaleString('de-DE');
const artLabel=a=>a==='privat'?'Privat':a==='arbeit'?'Arbeit':'Wohn-Arbeit';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

function render(){
  const data=ld();
  const tb=document.getElementById('tb');
  if(!data.length){
    tb.innerHTML='<tr><td colspan="7"><div class="empty">Noch keine Fahrten eingetragen.</div></td></tr>';
  } else {
    tb.innerHTML=data.slice().reverse().map((e,ri)=>{
      const i=data.length-1-ri;
      const bc=e.art==='privat'?'bp':e.art==='arbeit'?'ba':'bw';
      return`<tr>
        <td>${fd(e.datum)}</td>
        <td><span class="badge ${bc}">${artLabel(e.art)}</span></td>
        <td style="color:var(--text2);font-size:12px">${e.zweck||'&#x2014;'}</td>
        <td>${fmt(e.start)} km</td>
        <td>${fmt(e.end)} km</td>
        <td style="font-weight:600">${fmt(e.km)} km</td>
        <td><button class="xbtn" onclick="del(${i})">&#x2715;</button></td>
      </tr>`;
    }).join('');
  }
  const now=new Date();
  const totalKm=data.reduce((s,e)=>s+e.km,0);
  const moKm=data.filter(e=>{const d=new Date(e.datum);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}).reduce((s,e)=>s+e.km,0);
  document.getElementById('sn').textContent=data.length;
  document.getElementById('skm').textContent=fmt(totalKm);
  document.getElementById('smo').textContent=fmt(moKm);
}

function add(){
  const datum=document.getElementById('d').value;
  const art=document.getElementById('a').value;
  const zweck=document.getElementById('zw').value.trim();
  const start=parseInt(document.getElementById('s').value);
  const end=parseInt(document.getElementById('e').value);
  if(!datum){alert('Bitte Datum ausw\u00e4hlen.');return;}
  if(!art){alert('Bitte Fahrtart ausw\u00e4hlen.');return;}
  if(isNaN(start)||start<0){alert('Bitte g\u00fcltigen Anfangs-km eingeben.');return;}
  if(isNaN(end)||end<0){alert('Bitte g\u00fcltigen Ende-km eingeben.');return;}
  if(end<=start){alert('Ende-km muss gr\u00f6\u00dfer als Anfangs-km sein.');return;}
  const data=ld();
  data.push({datum,art,zweck,start,end,km:end-start});
  data.sort((a,b)=>a.datum.localeCompare(b.datum));
  sv(data);
  document.getElementById('s').value='';
  document.getElementById('e').value='';
  document.getElementById('a').value='';
  document.getElementById('zw').value='';
  const p=document.getElementById('prev');
  p.textContent='wird berechnet \u2026';p.classList.remove('ok');
  render();
  showToast('&#x2705; Fahrt gespeichert');
}

function del(i){
  if(!confirm('Eintrag l\u00f6schen?'))return;
  const data=ld();data.splice(i,1);sv(data);render();
}

function clearAll(){
  if(!confirm('Wirklich ALLE Eintr\u00e4ge l\u00f6schen?'))return;
  sv([]);render();
}

function upd(){
  const s=parseInt(document.getElementById('s').value);
  const e=parseInt(document.getElementById('e').value);
  const p=document.getElementById('prev');
  if(!isNaN(s)&&!isNaN(e)&&e>s){p.textContent=fmt(e-s)+' km';p.classList.add('ok');}
  else{p.textContent='wird berechnet \u2026';p.classList.remove('ok');}
}

function buildCSV(){
  const data=ld();
  if(!data.length)return null;
  const BOM='\uFEFF';
  const sep=';';
  const rows=[['Datum','Fahrtart','Zweck','Anfang km','Ende km','Gefahrene km'].join(sep)];
  data.forEach(e=>rows.push([fd(e.datum),artLabel(e.art),e.zweck||'',e.start,e.end,e.km].join(sep)));
  const totalKm=data.reduce((s,e)=>s+e.km,0);
  rows.push('');
  rows.push(['Gesamt','','','','',totalKm].join(sep));
  return BOM+rows.join('\r\n');
}

function exportCSV(){
  const csv=buildCSV();
  if(!csv){alert('Keine Daten zum Exportieren.');return;}
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const now=new Date();
  const name='Fahrtenbuch_'+now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'.csv';
  const a=document.createElement('a');
  a.href=url;a.download=name;a.click();
  URL.revokeObjectURL(url);
  showToast('&#x1F4E5; CSV wird heruntergeladen');
}

async function shareCSV(){
  const csv=buildCSV();
  if(!csv){alert('Keine Daten zum Teilen.');return;}
  const now=new Date();
  const name='Fahrtenbuch_'+now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'.csv';
  if(navigator.share&&navigator.canShare){
    try{
      const file=new File([csv],name,{type:'text/csv'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({title:'Fahrtenbuch',files:[file]});
        return;
      }
    }catch(e){if(e.name==='AbortError')return;}
  }
  // Fallback: normaler Download
  exportCSV();
}

document.getElementById('s').addEventListener('input',upd);
document.getElementById('e').addEventListener('input',upd);
document.getElementById('d').value=new Date().toISOString().split('T')[0];
const mo=['Januar','Februar','M\u00e4rz','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const n=new Date();
document.getElementById('hdate').textContent=n.getDate()+'. '+mo[n.getMonth()]+' '+n.getFullYear();
render();
</script>
</body>
</html>
